name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest bandit flake8 mypy coverage safety
    
    - name: Run pytest
      run: pytest tests/ -v
    
    - name: Run bandit
      run: bandit -r skillgate.py ast_analyzer.py ecosystem.py -f txt --severity-level medium
    
    - name: Run flake8
      run: flake8 skillgate.py ast_analyzer.py ecosystem.py --max-line-length=120
    
    - name: Run mypy
      run: mypy skillgate.py ast_analyzer.py ecosystem.py --ignore-missing-imports
    
    - name: Run coverage
      run: |
        coverage run -m pytest tests/
        coverage report --fail-under=80
        coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
