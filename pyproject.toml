[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillgate"
version = "1.0.0"
authors = [
  { name = "zhaoxinghua09-cell" }
]
description = "Trust infrastructure for AI agent skills"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
keywords = ["security", "agent", "skills", "scanner", "trust"]

[project.scripts]
skillgate = "skillgate:main"

[tool.setuptools]
py-modules = ["skillgate", "ast_analyzer"]
