[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillgate"
version = "0.3.0"
authors = [
  { name = "SkillGate Contributors" }
]
description = "Trust infrastructure for AI agent skills — scan, benchmark, and gate before you ship."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
keywords = ["skill", "security", "scan", "gate", "ai", "agent", "trust"]

[project.scripts]
skillgate = "skillgate:main"
skillbench = "skillbench:main"
skillwatch = "skillwatch:main"

[project.urls]
Homepage = "https://github.com/your-org/skillgate"
Repository = "https://github.com/your-org/skillgate"
"Bug Tracker" = "https://github.com/your-org/skillgate/issues"
