<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGD-Evo 方法论</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }
        h1 { color: #58a6ff; margin-bottom: 20px; }
        h2 { color: #79c0ff; margin-top: 30px; }
        .law {
            background: #161b22;
            padding: 16px;
            border-radius: 6px;
            margin: 12px 0;
            border-left: 4px solid #58a6ff;
        }
    </style>
</head>
<body>
    <h1>📖 LGD-Evo 自生长生态方法论</h1>

    <h2>🎯 核心理念</h2>
    <p>不追求一步到位，但是每一步都要扎实；不吹牛，能做的就说能做，做不到的就说做不到；最后做成一个会自己变好的系统。</p>

    <h2>📜 LGD 三律</h2>
    <div class="law">
        <strong>有籍（Registered）</strong><br>
        每个任务有档案可追溯
    </div>
    <div class="law">
        <strong>有证（Evidenced）</strong><br>
        每个结论有出处有证据
    </div>
    <div class="law">
        <strong>有门禁（Gated）</strong><br>
        关键节点有检查有验证
    </div>

    <h2>📈 主动性四个层次</h2>
    <p>1. 被动执行 → 2. 主动建议 → 3. 主动执行 → 4. 完全自主</p>

    <h2>🔄 自我进化闭环</h2>
    <p>收集数据 → 诊断问题 → 改进 → 验证 → 记录 → 循环</p>
</body>
